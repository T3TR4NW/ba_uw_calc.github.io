<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ブルアカ 固有武器強化計算機</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf6fc;color:#20354a;font:16px system-ui,sans-serif}main{max-width:620px;margin:32px auto;padding:16px}header{background:#087dc2;color:white;padding:25px;border-radius:16px 16px 0 0}h1{font-size:clamp(20px,5vw,28px);margin:0 0 6px}header small{letter-spacing:1px}section{background:white;padding:24px;border-radius:0 0 16px 16px;box-shadow:0 8px 32px #164b7414}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:600;font-size:14px}input,select,button{font:inherit;width:100%;margin-top:7px;padding:12px;border:1px solid #a6c5d9;border-radius:8px;background:white;color:#20354a}input:focus,select:focus{outline:2px solid #168bd2}p{line-height:1.65}dl{display:grid;grid-template-columns:1fr auto;gap:12px;margin:24px 0}dd{margin:0;font-weight:bold}.result{background:#e5f5ff;border-radius:12px;padding:22px;text-align:center}.result strong{display:block;font-size:44px;color:#086fae;font-variant-numeric:tabular-nums}button{cursor:pointer;color:#086fae;font-weight:bold;margin-top:20px}details{margin-top:20px;font-size:14px}summary{cursor:pointer}footer{text-align:center;font-size:12px;color:#52697e;margin:20px} @media(max-width:420px){main{margin:8px auto;padding:10px}section{padding:16px}.fields{grid-template-columns:1fr}}
</style></head><body><main><header><h1>固有武器強化計算機</h1><small>BLUE ARCHIVE / ELEPH CALCULATOR</small></header><section><div class="fields"><label>現在の段階<select id="start"></select></label><label>目標の段階<select id="end"></select></label><label>所持している神名文字（個）<input id="owned" type="number" min="0" step="1" value="0" inputmode="numeric"></label><label>現在の交換レート<select id="rate"></select></label><label id="remainLabel">現在のレートで交換できる残り個数<input id="remain" type="number" min="0" max="20" step="1" value="20" inputmode="numeric"></label></div><dl><dt>必要な神名文字</dt><dd id="need"></dd><dt>不足している神名文字</dt><dd id="missing"></dd></dl><div class="result" aria-live="polite">必要な神名のカケラ<strong id="total"></strong>個</div><button id="reset">リセット</button><details><summary>計算条件・交換内訳</summary><p>星4→固有1：120個<br>固有1→固有2：120個<br>固有2→固有3：180個<br>固有3→固有4：200個</p><p>交換レートは1～4の各段階で20個、以降は5で固定として計算します。</p><p id="breakdown"></p></details></section><footer>非公式ファンツール・入力データの外部送信なし</footer></main><script>
const $=id=>document.getElementById(id), ranks=['星4','固有1','固有2','固有3','固有4'], costs=[120,120,180,200];function opt(el,items){el.replaceChildren(...items.map(([v,t])=>new Option(t,v)))}opt($('start'),ranks.slice(0,-1).map((r,i)=>[i,r]));opt($('rate'),[1,2,3,4,5].map(i=>[i,`カケラ ${i} 個 / 神名文字1個`]));function targets(){let prev=+$('end').value,s=+$('start').value;opt($('end'),ranks.map((r,i)=>[i,r]).filter(([i])=>i>s));$('end').value=String(prev>s?prev:Math.min(4,s+1))}function integer(id,max){return Math.min(max,Math.max(0,Math.floor(Number($(id).value)||0)))}function calc(){let s=+$('start').value,e=+$('end').value,n=costs.slice(s,e).reduce((a,b)=>a+b,0),m=Math.max(0,n-integer('owned',1e9)),left=m,r=+$('rate').value,total=0,lines=[];$('remainLabel').hidden=r===5;for(let i=r;i<=5&&left>0;i++){let q=Math.min(left,i===5?left:i===r?integer('remain',20):20);left-=q;total+=q*i;if(q)lines.push(`${q}個 × ${i} = ${q*i}個`)}$('need').textContent=n.toLocaleString()+' 個';$('missing').textContent=m.toLocaleString()+' 個';$('total').textContent=total.toLocaleString();$('breakdown').textContent=lines.join(' / ')||'交換不要'}function reset(){$('start').value='0';targets();$('end').value='4';$('owned').value='0';$('rate').value='5';$('remain').value='20';calc()}$('start').addEventListener('change',()=>{targets();calc()});$('rate').addEventListener('change',()=>{$('remain').value='20';calc()});for(const id of ['end','owned','remain'])$(id).addEventListener('input',calc);$('reset').addEventListener('click',reset);reset();
</script></body></html>
